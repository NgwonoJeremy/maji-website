openapi: 3.0.0

info:
  title: Maji Platform - SkillsBridge API
  version: 1.0.0
  description: API exposed by Maji for SkillBridge to read estate, vendor and active deliverie schedules.

tags:
  - name: SkillsBridge
    description: Read-only endpoints consumed by SkillsBridge.

paths:

  /orders/active/estates:
    get:
      tags:
        - SkillsBridge
      summary: Get estates with active orders
      responses:
        '200':
          description: Estates where active orders are taking place
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - estate
                  properties:
                    estate:
                      type: string
                      example: Kasarani

  /orders/active/schedules:
    get:
      tags:
        - SkillsBridge
      summary: Get delivery schedules for active orders
      responses:
        '200':
          description: Active delivery schedules by estate
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - estate
                    - deliveryTime
                  properties:
                    estate:
                      type: string
                      example: Kasarani
                    deliveryTime:
                      type: string
                      example: "14:00"

  /vendors/top-rated:
    get:
      tags:
        - SkillsBridge
      summary: Get top-rated vendors
      responses:
        '200':
          description: Top-rated vendors and their business information
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - vendorId
                    - businessName
                    - estate
                    - rating
                    - isVerified
                    - isOnline
                  properties:
                    vendorId:
                      type: integer
                      example: 7
                    businessName:
                      type: string
                      example: Maji Fresh
                    estate:
                      type: string
                      example: Kasarani
                    rating:
                      type: number
                      format: float
                      minimum: 3
                      maximum: 5
                      example: 4.8
                    isVerified:
                      type: boolean
                      example: true
                    isOnline:
                      type: boolean
                      example: true
                    ownerName:
                      type: string
                      example: John Doe
                    phone:
                      type: string
                      example: "0712345678"

  /vendors/locations:
    get:
      tags:
        - SkillsBridge
      summary: Get vendor locations
      description: >
        SkillsBridge needs to read each water vendor's station name and
        primary target estate in order to suggest those vendor locations
        as physical meetup venues for skill sessions.
      responses:
        '200':
          description: Water vendor station names and primary target estates
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - vendorId
                    - businessName
                    - estate
                  properties:
                    vendorId:
                      type: integer
                      example: 7
                    businessName:
                      type: string
                      example: Maji Fresh
                    estate:
                      type: string
                      example: Kasarani